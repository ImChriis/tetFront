<header class="topbar">
  <div class="wrap">
    <a class="marca" routerLink="/">
      <img src="imagenes/logo_ujgh.png" alt="UJGH">
      <span>Repositorio de<br>Trabajos Especiales de Grado</span>
    </a>
  </div>
</header>

<main class="acceso">
  <div class="acceso-arte">
    <blockquote>
      Cada trabajo de grado es un aporte que se queda en casa.
      <cite>Repositorio de TEG · UJGH</cite>
    </blockquote>
  </div>

  <div class="acceso-form">
    <form (submit)="$event.preventDefault()">
      <span class="eyebrow"><mat-icon>admin_panel_settings</mat-icon> Acceso administrativo</span>
      <h2>Iniciar sesión</h2>
      <p class="sub">Para decanos y personal autorizado.</p>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
      </div>

      <button type="submit" class="boton boton-azul">Ingresar <mat-icon>arrow_forward</mat-icon></button>
      <a class="volver" routerLink="/trabajos"><mat-icon>arrow_back</mat-icon> Volver al buscador</a>
    </form>
  </div>
</main>
