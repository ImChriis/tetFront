<section class="hero">
  <div class="wrap">
    <span class="eyebrow anim"><mat-icon>groups</mat-icon> Equipo de desarrollo</span>
    <h1 class="anim anim-2">¿Dudas o sugerencias? <em>Escríbenos.</em></h1>
    <p class="lead-text anim anim-3">Este repositorio fue desarrollado por estudiantes de Ingeniería de la UJGH.</p>
  </div>
</section>

<main class="equipo">
  <div class="wrap grid-equipo">
    @for (persona of equipo; track persona.correo; let i = $index) {
      <article class="persona-card" [style.--i]="i">
        <img [src]="'imagenes/' + persona.foto" [alt]="'Foto de ' + persona.nombre">
        <h3>{{ persona.nombre }}</h3>
        <p>Estudiante de {{ persona.carrera }}</p>
        <a class="boton boton-suave boton-sm" [href]="'mailto:' + persona.correo"><mat-icon>mail</mat-icon> {{ persona.correo }}</a>
      </article>
    }
  </div>
</main>
